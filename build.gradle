plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+neoforge-${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
}

dependencies {
    // Other mods to load beside this one in dev runs (jars in libs/, gitignored); never in the jar
    localRuntime fileTree('libs') { include '*.jar' }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            jvmArgument '-Xmx3G'
            // gradlew runClient -Pselftest: the in-game check (src/selftest) opens the checklist, kills a boss and quits
            if (project.hasProperty('selftest')) {
                systemProperty 'boss_checklist.selftest', 'true'
            }
            // keeps the window from taking focus when a mod in libs/ honours it (Ultima Ratio's WindowMixin does)
            if (project.hasProperty('nofocus') || project.hasProperty('selftest')) {
                systemProperty 'ultimaratio.nofocus', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The in-game self-test, only in -Pselftest runs (never build a release jar with -Pselftest)
if (project.hasProperty('selftest')) {
    sourceSets.main.java.srcDir 'src/selftest/java'
    sourceSets.main.resources.srcDir 'src/selftest/resources'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            selftest_mixins        : project.hasProperty('selftest') ? '[[mixins]]\nconfig="boss_checklist_selftest.mixins.json"' : '',
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_version            : version.toString(),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// MIT: the licence text and the credits ship in the jar
tasks.named('jar') {
    from(['LICENSE.txt', 'NOTICE.md']) {
        into 'META-INF'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}
